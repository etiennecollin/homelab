---
services:
  actual-budget:
    image: "actualbudget/actual-server:26.8.1"
    container_name: "actual-budget"
    restart: "unless-stopped"
    volumes:
      - "./actual-data:/data"
    networks:
      - "proxy"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.actual-budget.rule=Host(`budget.${DOMAIN}`)"
      - "traefik.http.services.actual-budget.loadbalancer.server.port=5006"
    # healthcheck:
    #   test: ["CMD-SHELL", "node scripts/health-check.js"]
    #   interval: "60s"
    #   timeout: "10s"
    #   retries: "3"
    #   start_period: "20s"

networks:
  proxy:
    external: "true"
