name: "immich"

services:
  immich-server:
    container_name: "immich_server"
    image: "ghcr.io/immich-app/immich-server:v3.3.1"
    volumes:
      - "./library:/data"
      - "/etc/localtime:/etc/localtime:ro"
      - "/mnt/ssd-ext/1.\ Photo:/mnt/ssd-ext/1.\ Photo:ro"
      - "/mnt/ssd-ext/3.\ Video/Content/grand-maman:/mnt/grand-maman:ro"
      - "/mnt/ssd-ext/3.\ Video/Content/Travel:/mnt/travel:ro"
      - "/mnt/ssd-ext/media:/mnt/media:ro"
    environment:
      TZ: "${TIMEZONE}"
    depends_on:
      - "redis"
      - "database"
    networks:
      - "proxy"
      - "immich"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`immich.${DOMAIN}`)"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
    restart: "unless-stopped"
    healthcheck:
      disable: "false"

  immich-machine-learning:
    container_name: "immich_machine_learning"
    image: "ghcr.io/immich-app/immich-machine-learning:v3.3.1"
    volumes:
      - "model-cache:/cache"
    environment:
      MACHINE_LEARNING_MODEL_REVISION: "v2"
    restart: "unless-stopped"
    networks:
      - "immich"
    healthcheck:
      disable: "false"

  redis:
    container_name: "immich_redis"
    image: "docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd"
    healthcheck:
      test: "redis-cli ping | grep -q PONG || exit 1"
    restart: "unless-stopped"
    networks:
      - "immich"

  database:
    container_name: "immich_postgres"
    image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_DB: "${DB_DATABASE_NAME}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
      DB_STORAGE_TYPE: "SSD"
    volumes:
      - "./postgres:/var/lib/postgresql/data"
    shm_size: "128mb"
    restart: "unless-stopped"
    networks:
      - "immich"
    healthcheck:
      disable: "false"

volumes:
  model-cache:

networks:
  proxy:
    external: "true"
  immich:
    name: "immich"
    driver: "bridge"
